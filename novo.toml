[package]
name        = "junit-nv"
version     = "0.1.0"
description = "JUnit XML, the report format every CI reads: the de-facto schema as typed values — testsuites and testsuite, testcase with one outcome, failure, error and skipped, properties, system-out and system-err, timestamps and durations — read from a document and written into a caller's buffer, with the characters XML 1.0 cannot carry refused rather than embedded."
license     = "Apache-2.0"

# `experimental` because no program outside this package has used the
# surface yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  A report is a value built from durations and text the caller
# already holds, and writing one appends to the caller's buffer.  No
# file is opened and no clock is read: a suite's `timestamp` arrives as
# the text it will carry, and a duration arrives as an integer count of
# microseconds, because a `core` package may read neither a clock nor a
# directory.
layer       = "core"

category    = "tooling"

tags        = ["junit", "junit-xml", "test-report", "ci", "surefire", "testsuite", "xml", "tooling"]
repository  = "https://github.com/novolang/junit-nv"
maintainers = ["novo-lang"]
# Built, tested and measured on 0.20.2.  The floor is the toolchain the
# release was checked against rather than the oldest one that might
# work.
novo        = ">= 0.20.2"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "JUnit XML both ways, with the characters XML cannot carry refused"

[dependencies]
# xml-nv is the XML, both directions, and taking it rather than
# carrying a minimal writer is this package's one structural decision.
#
# Reading needs a tolerant parser: the reports in the wild are written
# by a dozen tools and several of them emit attributes in orders and
# spellings no schema mentions.  Writing needs the ESCAPING, which is
# where a minimal writer goes wrong: a `system-out` element carries
# whatever a test printed, and a test prints control characters.
# `xmlwrite.write_text` and `xmlwrite.write_attr_value` escape what
# character data and an attribute value need escaped, and they escape
# rather than refuse, so the refusal is this package's own:
# `junitwrite.first_unwritable` finds the first character XML 1.0
# section 2.2 does not admit, and the writer answers `JunitUnwritable`
# with its offset rather than emitting a document no parser will read
# back.
xml-nv = "^0.1.1"
